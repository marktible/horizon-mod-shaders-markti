name: Prepare native release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic native assets
        run: |
          python3 tools/package.py
          git diff --exit-code -- dist
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          markti_tag=$(python3 -c 'import json; print("v" + json.load(open("dist/manifest.json"))["version"])')
          mkdir -p "$RUNNER_TEMP/markti-native-release"
          awk '/\.hshader$/ { print }' dist/SHA256SUMS > "$RUNNER_TEMP/markti-native-release/SHA256SUMS"
          gh release create "$markti_tag" dist/markti_shaders.hshader dist/markti_shaders_ultra.hshader "$RUNNER_TEMP/markti-native-release/SHA256SUMS" \
            --draft --target "$GITHUB_SHA" --title "Markti Shaders $markti_tag" --notes-file CHANGELOG.md
