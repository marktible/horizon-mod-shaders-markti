name: Validate shaders

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch the official validation loader
        run: ./tools/bootstrap.sh
      - name: Check Rust and Python
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          python3 -m py_compile tools/*.py
      - name: Rebuild and validate both packs
        run: |
          python3 tools/package.py
          git diff --exit-code -- dist native-mod/bundles
          python3 tools/check_native_mods.py
          cargo run --locked --release -- packs/markti packs/markti-native dist/*.zip dist/*.hshader dist/*.hnmod
      - name: Check documentation
        run: python3 tools/check_docs.py

  native-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the official API source
        run: ./tools/bootstrap.sh
      - name: Compile both native trait mods against the official client library
        run: python3 tools/check_mod_api.py --jobs 2
