[package]
name = "horizon-pack-check"
version = "1.1.0"
edition = "2024"
license = "MIT"

[dependencies]
horizon-shaders = { path = ".upstream/horizon/crates/horizon-shaders" }
horizon-shader-api = { path = ".upstream/horizon/crates/horizon-shader-api" }
horizon-mods = { path = ".upstream/horizon/crates/horizon-mods", features = ["index"] }
