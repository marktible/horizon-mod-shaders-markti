# The engine's environment angles advance at 20 Hz. Smooth in world space,
# before building the shared shadow basis, so camera turns do not move the sun.
# Horizon expressions use matrix.column.row, matching GLSL matrix[column][row].
variable.float.radianceWorldLightX=gbufferModelViewInverse.0.0 * shadowLightPosition.x + gbufferModelViewInverse.1.0 * shadowLightPosition.y + gbufferModelViewInverse.2.0 * shadowLightPosition.z
variable.float.radianceWorldLightY=gbufferModelViewInverse.0.1 * shadowLightPosition.x + gbufferModelViewInverse.1.1 * shadowLightPosition.y + gbufferModelViewInverse.2.1 * shadowLightPosition.z
variable.float.radianceWorldLightZ=gbufferModelViewInverse.0.2 * shadowLightPosition.x + gbufferModelViewInverse.1.2 * shadowLightPosition.y + gbufferModelViewInverse.2.2 * shadowLightPosition.z
variable.vec3.radianceRawLight=vec3(radianceWorldLightX, radianceWorldLightY, radianceWorldLightZ) / max(sqrt(radianceWorldLightX * radianceWorldLightX + radianceWorldLightY * radianceWorldLightY + radianceWorldLightZ * radianceWorldLightZ), 0.000001)
variable.float.radianceSmoothX=smooth(radianceWorldLightX, 0.05)
variable.float.radianceSmoothY=smooth(radianceWorldLightY, 0.05)
variable.float.radianceSmoothZ=smooth(radianceWorldLightZ, 0.05)
variable.vec3.radianceSmoothLight=vec3(radianceSmoothX, radianceSmoothY, radianceSmoothZ) / max(sqrt(radianceSmoothX * radianceSmoothX + radianceSmoothY * radianceSmoothY + radianceSmoothZ * radianceSmoothZ), 0.000001)
variable.float.radianceDirectionAgreement=radianceRawLight.x * radianceSmoothLight.x + radianceRawLight.y * radianceSmoothLight.y + radianceRawLight.z * radianceSmoothLight.z
# Large time jumps and sun/moon switches take effect immediately.
uniform.vec3.radianceShadowLight=if(radianceDirectionAgreement > 0.998, radianceSmoothLight, radianceRawLight)
variable.float.radianceRightLength=max(sqrt(if(abs(radianceShadowLight.z) > 0.99, radianceShadowLight.z * radianceShadowLight.z + radianceShadowLight.x * radianceShadowLight.x, radianceShadowLight.x * radianceShadowLight.x + radianceShadowLight.y * radianceShadowLight.y)), 0.000001)
uniform.vec3.radianceShadowRight=if(abs(radianceShadowLight.z) > 0.99, vec3(radianceShadowLight.z, 0.0, -radianceShadowLight.x), vec3(-radianceShadowLight.y, radianceShadowLight.x, 0.0)) / radianceRightLength
uniform.vec3.radianceShadowUp=vec3(radianceShadowLight.y * radianceShadowRight.z - radianceShadowLight.z * radianceShadowRight.y, radianceShadowLight.z * radianceShadowRight.x - radianceShadowLight.x * radianceShadowRight.z, radianceShadowLight.x * radianceShadowRight.y - radianceShadowLight.y * radianceShadowRight.x)

